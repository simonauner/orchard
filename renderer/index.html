<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Orchard</title>
  <style>
    :root { color-scheme: light dark; --bd: #8884; --muted: #888; --hover: #8882; --card: #8881; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; font: 14px system-ui, sans-serif; }
    button, select, textarea, input { font: inherit; color: inherit; }
    #side { width: 260px; border-right: 1px solid var(--bd); display: flex; flex-direction: column; }
    .nav { display: block; width: 100%; text-align: left; padding: 10px 12px; background: none; border: 0; cursor: pointer; }
    .nav:hover, .nav.active { background: var(--hover); }
    .section { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 4px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--bd); }
    .icon { background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 16px; padding: 0 4px; }
    .icon:hover { color: inherit; }
    #list { flex: 1; overflow: auto; }
    .ws { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; font-weight: 600; }
    .ws .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ws .more { visibility: hidden; }
    .ws:hover .more, .ws .more:focus-visible { visibility: visible; }
    .hiddenWs > summary { padding: 8px 12px; color: var(--muted); font-size: 12px; cursor: pointer; }
    .menu { position: fixed; z-index: 10; min-width: 180px; padding: 4px; border: 1px solid var(--bd); border-radius: 8px; background: Canvas; box-shadow: 0 6px 20px #0004; display: flex; flex-direction: column; }
    .menu button { text-align: left; padding: 6px 10px; border: 0; border-radius: 5px; background: none; cursor: pointer; }
    .menu button:hover, .menu button:focus-visible { background: var(--hover); outline: none; }
    .menu .danger { color: #d33; border-top: 1px solid var(--bd); border-radius: 0 0 5px 5px; }
    .item { display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 24px; cursor: pointer; }
    .item:hover, .item.active { background: var(--hover); }
    .item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .rm { visibility: hidden; }
    .item:hover .rm, .item.active .rm { visibility: visible; }
    .hint { padding: 6px 12px; color: var(--muted); font-size: 12px; }
    .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #999; }
    .dot.working, .dot.setup { background: #e0a800; } .dot.done { background: #2e9e4f; }
    .dot.error, .dot.stopped { background: #d33; }
    main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #createView { margin: 12vh auto 0; width: min(600px, 100% - 32px); }
    .card { border: 1px solid var(--bd); border-radius: 10px; background: var(--card); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .card textarea { width: 100%; min-height: 120px; resize: vertical; border: 0; background: none; outline: none; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row .spacer { flex: 1; }
    select { background: none; border: 0; cursor: pointer; padding: 4px; }
    #createBtn { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--bd); cursor: pointer; }
    #err { color: #d33; margin-top: 8px; font-size: 13px; }
    #chatView { flex: 1; display: flex; min-height: 0; }
    #chatCol { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #panel { width: 42%; min-width: 360px; display: flex; flex-direction: column; border-left: 1px solid var(--bd); }
    #panel[hidden] { display: none; }
    #out { flex: 1; overflow: auto; padding: 10px 12px; }
    #chatView[hidden], #createView[hidden], #settingsView[hidden] { display: none; }
    #side #list + .nav { border-top: 1px solid var(--bd); }
    #settingsView { flex: 1; overflow: auto; padding: 24px 32px; }
    #settingsView > * { max-width: 700px; }
    #settingsView h1 { font-size: 20px; margin: 0 0 20px; }
    #settingsView h2 { font-size: 14px; margin: 28px 0 4px; }
    .tab { display: inline-block; padding: 0 0 8px; border-bottom: 2px solid currentColor; font-weight: 600; margin-bottom: 16px; }
    .statusRow { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
    .statusRow > span { display: flex; align-items: center; gap: 6px; }
    .dot.ok { background: #2e9e4f; } .dot.bad { background: #d33; }
    #stTable { width: 100%; border-collapse: collapse; border: 1px solid var(--bd); }
    #stTable th, #stTable td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--bd); font-weight: normal; }
    #stTable th { color: var(--muted); width: 150px; border-right: 1px solid var(--bd); }
    .btn { text-decoration: none; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--bd); background: none; cursor: pointer; white-space: nowrap; }
    #settingsView .row input { flex: 1; padding: 6px 8px; font-family: ui-monospace, monospace; font-size: 12px; }
    code { font-family: ui-monospace, monospace; font-size: 12px; }
    .bad-text { color: #d33; }
    #title { padding: 10px 16px; border-bottom: 1px solid var(--bd); }
    #title small { color: var(--muted); margin-left: 8px; }
    #log { flex: 1; overflow: auto; padding: 16px max(16px, calc((100% - 800px) / 2)); }
    .msg { margin: 0 0 12px; white-space: pre-wrap; line-height: 1.45; }
    .msg.you { margin-left: auto; width: fit-content; max-width: 75%; padding: 8px 12px; border-radius: 14px; background: var(--hover); }
    .msg.assistant { white-space: normal; font-size: 15px; line-height: 1.65; }
    .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
    .md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 0 0 16px; }
    .md li + li, .md li > ul, .md li > ol { margin-top: 6px; }
    .md li > ul, .md li > ol { margin-bottom: 0; }
    .md h1, .md h2, .md h3, .md h4 { font-size: 16px; margin: 22px 0 8px; }
    .md ul, .md ol { padding-left: 26px; }
    .md code { padding: 2px 5px; border-radius: 5px; background: var(--hover); font-size: 13px; }
    .md pre { padding: 12px 14px; border-radius: 8px; background: var(--card); overflow-x: auto; line-height: 1.5; }
    .md pre code { padding: 0; background: none; }
    .md table { border-collapse: collapse; }
    .md th, .md td { border: 1px solid var(--bd); padding: 4px 8px; text-align: left; }
    .md blockquote { padding-left: 10px; border-left: 3px solid var(--bd); color: var(--muted); }
    .md a { color: #4c8dff; }
    .actions { display: flex; gap: 2px; margin-top: 4px; visibility: hidden; }
    .actions .icon { font-size: 11px; font-weight: 600; min-width: 24px; height: 22px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; }
    .actions .icon:hover { background: var(--hover); }
    .msg.assistant:hover .actions, .actions:focus-within { visibility: visible; }
    .tool { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
    .meta { color: var(--muted); font-size: 12px; }
    #tabs { padding: 0 12px; border-bottom: 1px solid var(--bd); min-height: 41px; }
    .tabBtn { white-space: nowrap; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 4px; cursor: pointer; color: var(--muted); }
    .tabBtn.active { color: inherit; border-bottom-color: currentColor; }
    .tabBtn.running::after { content: ' ●'; color: #2e9e4f; }
    .out { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, monospace; font-size: 12px; }
    #form[hidden], #runSel[hidden], #runBtn[hidden], #openBtn[hidden] { display: none; }
    .fold > summary { color: var(--muted); font-size: 12px; cursor: pointer; }
    .fold[open] > summary { margin-bottom: 12px; }
    .fold > .msg { padding-left: 14px; border-left: 2px solid var(--bd); margin-bottom: 0; padding-bottom: 12px; }
    #form { margin: 0 auto 16px; width: calc(100% - 32px); max-width: 800px; }
    #form textarea { min-height: 60px; max-height: 40vh; resize: none; }
    #agentModel { color: var(--muted); font-size: 13px; padding: 4px; }
    #go { width: 32px; height: 32px; border-radius: 8px; border: 0; background: #eee; color: #111; font-size: 16px; cursor: pointer; }
    #go:disabled { opacity: .4; cursor: default; }
  </style>
</head>
<body>
  <nav id="side">
    <button class="nav" id="navCreate">+ Create</button>
    <div class="section"><span>Workspaces</span><button class="icon" id="addWs" title="Add workspace" aria-label="Add workspace">+</button></div>
    <div id="list"></div>
    <button class="nav" id="navSettings">Settings</button>
  </nav>
  <main>
    <section id="createView">
      <form class="card" id="createForm">
        <div class="row">
          <select id="ws" aria-label="Workspace"></select>
        </div>
        <textarea id="prompt" placeholder="What do you want to work on?" aria-label="What do you want to work on?"></textarea>
        <div class="row">
          <select id="model" aria-label="Model">
            <option value="">Default model</option>
            <option value="fable">Fable</option>
            <option value="opus">Opus</option>
            <option value="sonnet">Sonnet</option>
            <option value="haiku">Haiku</option>
          </select>
          <select id="effort" aria-label="Effort">
            <option value="">Default effort</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="xhigh">Extra high</option>
            <option value="max">Max</option>
          </select>
          <span class="spacer"></span>
          <button id="createBtn">Create ↵</button>
        </div>
      </form>
      <div id="err" role="alert"></div>
    </section>
    <section id="settingsView" hidden>
      <h1>Agents</h1>
      <div class="tab">Claude Code</div>
      <div class="statusRow">
        <span><span class="dot" id="stDot"></span><span id="stText">Checking…</span></span>
        <button class="btn" id="refresh">↻ Refresh</button>
      </div>
      <table id="stTable"></table>
      <p id="stHint" class="meta"></p>

      <h2>Claude Code executable path</h2>
      <p class="meta">Leave empty to use <code>claude</code> from your PATH. Applies to agents created after the change.</p>
      <div class="row">
        <input id="claudePath" placeholder="claude (from PATH)" aria-label="Claude Code executable path" autocomplete="off" spellcheck="false" />
        <button class="btn" id="browse">Browse…</button>
        <button class="btn" id="systemClaude">Use system Claude Code</button>
      </div>
      <p id="pathMsg" class="meta" role="alert"></p>

      <h2>Claude settings</h2>
      <p><code id="settingsFile">~/.claude/settings.json</code></p>
    </section>
    <section id="chatView" hidden>
      <div id="chatCol">
      <div id="title"><b></b><small></small></div>
      <div id="log"></div>
      <form class="card" id="form">
        <textarea id="text" placeholder="Message the agent…" aria-label="Message the agent"></textarea>
        <div class="row">
          <span id="agentModel"></span>
          <span class="spacer"></span>
          <button id="go" title="Send" aria-label="Send">↑</button>
        </div>
      </form>
      </div>
      <aside id="panel" aria-label="Scripts">
        <div id="tabs" class="row">
          <button class="tabBtn" data-tab="setup">Setup</button>
          <button class="tabBtn" data-tab="run">Run</button>
          <span class="spacer"></span>
          <select id="runSel" aria-label="Run script"></select>
          <a class="btn" id="openBtn" target="_blank" hidden></a>
          <button class="btn" id="runBtn">▶ Run</button>
        </div>
        <div id="out"></div>
      </aside>
    </section>
  </main>
  <script src="../node_modules/marked/lib/marked.umd.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
